<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat with Happy</title>
<link rel="stylesheet" href="chat.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="chat-container">
  <header class="chat-header">
    <a href="index.html" class="back"><i class="fas fa-arrow-left"></i></a>
    <div class="user">
      <div class="avatar">H</div>
      <div>
        <h3>Happy</h3>
        <span class="status"><i class="fas fa-circle"></i> Online</span>
      </div>
    </div>
  </header>

  <!-- Username Modal -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <h2>👋 Hey there!</h2>
      <p>Enter your name to start chatting with Happy</p>
      <input type="text" id="username" placeholder="Your name..." />
      <button id="joinBtn">Start Chat</button>
    </div>
  </div>

  <main class="chat-messages" id="messages"></main>

  <div class="typing" id="typing"></div>

  <form class="chat-input" id="form">
    <input type="text" id="msg" placeholder="Type a message..." autocomplete="off" />
    <button type="submit"><i class="fas fa-paper-plane"></i></button>
  </form>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="chat.js"></script>
</body>
</html>
